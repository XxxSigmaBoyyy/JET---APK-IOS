# Generated by jetc/bundle2ios.py from the APK. Build with: xcodegen generate && xcodebuild ...
name: JetApp
options:
  bundleIdPrefix: dev.jet.translated
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"        # unsigned in CI; sign later with your own certificate
    CODE_SIGNING_REQUIRED: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  JetApp:
    type: application
    platform: iOS
    sources:
      - path: JetApp
        excludes: ["JetBundle/**"]
      - path: JetApp/JetBundle
        type: folder                 # copied as-is into the .app (JetBundle/)
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "dev.jet.translated.org.debian.eugen.headingcalculator"
        PRODUCT_NAME: JetApp
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: JetApp/JetBridge.h
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: JetApp/Info.plist
    info:
      path: JetApp/Info.plist
      properties:
        CFBundleDisplayName: "Heading Calculator"     # = android:label of the APK
        CFBundleName: "Heading Calculator"
        JETAndroidPackage: "org.debian.eugen.headingcalculator"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dev.jet.launch
            CFBundleURLSchemes: [jet]
