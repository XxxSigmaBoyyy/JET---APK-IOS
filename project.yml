# XcodeGen spec for the JET iOS shell.  Generate the project with:  xcodegen generate
# CI builds it unsigned (CODE_SIGNING_ALLOWED=NO); locally you can pick your own team for ad-hoc / development signing.
name: JET
options:
  bundleIdPrefix: dev.jet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "15.4"
  projectFormat: xcode15_3   # opens in Xcode 15.3+ (CI uses Xcode 15.4 on macos-14)
# Optional prebuilt JET runtime (docs/RUNTIME_LINK.md): JET_RUNTIME=YES xcodegen generate
include:
  - path: project.runtime.yml
    enable: ${JET_RUNTIME}
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  JET:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JET
    settings:
      base:
        PRODUCT_NAME: JET
        PRODUCT_BUNDLE_IDENTIFIER: dev.jet.app
        INFOPLIST_FILE: JET/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: JET/Bridge/JET-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        # Signing: automatic with no team = unsigned-capable. Set DEVELOPMENT_TEAM locally for ad-hoc/dev builds;
        # CI passes CODE_SIGNING_ALLOWED=NO and E-SIGN / AltStore / Sideloadly sign the .ipa on the device side.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
schemes:
  JET:
    build:
      targets:
        JET: all
    run:
      config: Debug
    archive:
      config: Release
