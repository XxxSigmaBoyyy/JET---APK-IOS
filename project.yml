# XcodeGen spec for the JET iOS shell.  Generate the project with:  xcodegen generate
# CI builds it unsigned (CODE_SIGNING_ALLOWED=NO); locally you can pick your own team for ad-hoc / development signing.
name: JET
options:
  bundleIdPrefix: dev.jet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "15.4"
  projectFormat: xcode15_3   # opens in Xcode 15.3+ (CI uses Xcode 15.4 on macos-14)
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  JET:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JET
      # JET runtime (no JIT: AOT-compiled app code + native Android view engine), compiled from source
      - path: Runtime
        excludes:
          - "contract_test.c"
          - "test/**"
          # Partner/bionic host call-outs; linked when Runtime/native interpreter lands.
          - "bionic/**"
          - "interp/**"
          # partner native: host-only test drivers and build files are not app sources
          - "native/tests/**"
          - "native/Makefile"
          - "native/build.sh"
          - "native/README.md"
          - "native/third_party/**"
      # AOT app modules generated by tools/aot/gen_module.sh from open-source APKs (see each NOTICE)
      - path: Modules
    dependencies:
      # partner native (Runtime/native/host_bionic.c): zlib for guest libz calls
      - sdk: libz.tbd
    # no-JIT JVM (OpenJDK 21 Zero) built by CI (scripts/jre/), staged into Vendor/ by scripts/stage_jvm.sh
    postBuildScripts:
      - name: Embed JRE + JET Java code
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP="$TARGET_BUILD_DIR/$WRAPPER_NAME"
          SRC="$PROJECT_DIR/Vendor/jre-$PLATFORM_NAME/jre"
          if [ -d "$SRC" ]; then rsync -a --delete "$SRC/" "$APP/jre/"; echo "embedded JRE $(du -sh "$APP/jre" | cut -f1)"; else echo "note: no JRE staged for $PLATFORM_NAME"; fi
          if [ -d "$PROJECT_DIR/Vendor/jvm-app" ]; then rsync -a --delete "$PROJECT_DIR/Vendor/jvm-app/" "$APP/jvm-app/"; fi
    settings:
      base:
        PRODUCT_NAME: JET
        PRODUCT_BUNDLE_IDENTIFIER: dev.jet.app
        INFOPLIST_FILE: JET/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: JET/Bridge/JET-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/Runtime", "$(PROJECT_DIR)/Runtime/jvm", "$(PROJECT_DIR)/Runtime/native", "$(PROJECT_DIR)/JET/Bridge", "$(PROJECT_DIR)/Vendor/jni"]
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GCC_C_LANGUAGE_STANDARD: gnu11
        # generated C relies on Java's wrap-around integer semantics
        OTHER_CFLAGS: ["$(inherited)", "-include", "$(PROJECT_DIR)/Runtime/compat/jet_ios_compat.h", "-fwrapv", "-Wno-parentheses-equality", "-Wno-unused-label", "-Wno-unused-variable", "-Wno-unused-but-set-variable", "-Wno-unused-function", "-Wno-incompatible-pointer-types-discards-qualifiers"]
        OTHER_LDFLAGS: ["$(inherited)", "-lz"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "JET_RUNTIME_LINKED=1"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        # Signing: automatic with no team = unsigned-capable. Set DEVELOPMENT_TEAM locally for ad-hoc/dev builds;
        # CI passes CODE_SIGNING_ALLOWED=NO and E-SIGN / AltStore / Sideloadly sign the .ipa on the device side.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
schemes:
  JET:
    build:
      targets:
        JET: all
    run:
      config: Debug
    archive:
      config: Release
