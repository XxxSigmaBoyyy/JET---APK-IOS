name: jre-ios (OpenJDK 21 Zero, no JIT)
# Builds the no-JIT JVM runtime that JET embeds (M2 "option A"). Output is a CI artifact only.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ 'm2-*' ]
    paths: [ 'scripts/jre/**', '.github/workflows/jre-ios.yml' ]
jobs:
  jre:
    strategy:
      fail-fast: false
      matrix:
        sdk: [ iphonesimulator, iphoneos ]
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21.0.1' }
      - name: Cache JRE
        id: cache
        uses: actions/cache@v4
        with:
          path: build/jre-out-${{ matrix.sdk }}
          key: jre21zero-v1-${{ matrix.sdk }}-${{ hashFiles('scripts/jre/**') }}
      - name: Build JRE (Zero) for ${{ matrix.sdk }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uname -m; sysctl -n hw.ncpu; xcodebuild -version
          scripts/jre/build_jre_ios.sh ${{ matrix.sdk }} "$PWD/build/jre-out-${{ matrix.sdk }}"
      - name: Package
        run: |
          cat build/jre-out-${{ matrix.sdk }}/BUILDINFO.txt
          tar -C build/jre-out-${{ matrix.sdk }} -cJf jre21-zero-${{ matrix.sdk }}.tar.xz jre BUILDINFO.txt
          ls -la jre21-zero-${{ matrix.sdk }}.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: jre21-zero-${{ matrix.sdk }}
          path: jre21-zero-${{ matrix.sdk }}.tar.xz
          retention-days: 30
      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jre-logs-${{ matrix.sdk }}
          path: |
            build/jre-work-${{ matrix.sdk }}/*.log
            build/jre-work-${{ matrix.sdk }}/jdk/build/*/config.log
          if-no-files-found: ignore
