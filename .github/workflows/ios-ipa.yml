name: iOS IPA (JET runtime)

on:
  push:
    branches: [main, 'm2-*']
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the .ipa to a GitHub Release on v* tags (built-in GITHUB_TOKEN)

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repository guard + runtime host test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # fails on tracked *.apk/*.ipa/*.p12/*.mobileprovision/... and on token-like strings (reports file:line only)
      - name: Repository guard
        run: scripts/guard_repo.sh
      - name: Pillow (frame rendering)
        run: python3 -c 'import PIL' 2>/dev/null || sudo apt-get install -y -q python3-pil
      # contract test + render/touch test of Runtime/ + Modules/ exactly as compiled into the app; the module's
      # open-source APK is downloaded from F-Droid (sha256-checked, see Modules/*/NOTICE) and never committed
      - name: Runtime host test
        run: scripts/test_runtime.sh build/runtime-test
      - name: Upload host frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-host-frames
          path: |
            build/runtime-test/*.png
            build/runtime-test/*.ops
          if-no-files-found: ignore

  native-ios:
    name: Partner native (Runtime/native) ios-arm64 compile (device + simulator)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Repository guard
        run: scripts/guard_repo.sh
      - name: Compile Runtime/native for iphoneos + iphonesimulator (arm64)
        run: scripts/build_native_ios.sh build/native-ios
      - name: Upload native compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-build-log
          path: build/native-ios/*.txt

  jre:
    name: JRE (OpenJDK 21 Zero, no JIT)
    uses: ./.github/workflows/jre-ios.yml

  build:
    name: Build JET.ipa (unsigned, runtime linked)
    needs: [guard, jre]
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SCHEME: JET
      CONFIGURATION: Release
      DERIVED: build/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository guard
        run: scripts/guard_repo.sh

      - name: Select Xcode
        run: |
          xcodebuild -version
          sudo xcode-select -p

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21.0.1' }
      - uses: actions/download-artifact@v4
        with: { name: jre21-zero-iphoneos, path: build/jre-dl }
      - name: Stage JRE + Java code (iphoneos)
        run: scripts/stage_jvm.sh iphoneos build/jre-dl/jre21-zero-iphoneos.tar.xz
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: App icon
        run: scripts/sync_icon.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Validate Info.plist
        run: plutil -lint JET/Resources/Info.plist

      - name: Build (generic iOS device, no signing)
        run: |
          mkdir -p build
          xcodebuild \
            -project JET.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || { grep -E 'error:' build/xcodebuild.log | head -n 80; tail -n 80 build/xcodebuild.log; exit 1; }
          grep -E '(error|warning):' build/xcodebuild.log | sort -u | head -n 60 || true
          test -d "$DERIVED/Build/Products/$CONFIGURATION-iphoneos/JET.app"

      - name: Check linked runtime
        run: |
          BIN="$DERIVED/Build/Products/$CONFIGURATION-iphoneos/JET.app/JET"
          strings "$BIN" | grep -E 'aot-0\.2' || { echo "::error::JET runtime (aot-0.2) not linked into $BIN"; exit 1; }
          if strings "$BIN" | grep -q 'stub-0\.'; then echo "::error::stub bridge still linked"; exit 1; fi
          nm -gU "$BIN" 2>/dev/null | grep -E ' _jet_runtime_(frame|touch|main)$' || true
          nm -gU "$BIN" 2>/dev/null | grep -E ' _jet_(interp_run|native_load|jni_onload)$' || { echo "::error::partner arm64 interpreter (Runtime/native) not linked"; exit 1; }
          lipo -info "$BIN"
          APP="$DERIVED/Build/Products/$CONFIGURATION-iphoneos/JET.app"
          ls "$APP/jre/lib/zero/libjvm.dylib" "$APP/jvm-app/jethello.jar"
          vtool -show-build "$APP/jre/lib/zero/libjvm.dylib" | grep -A1 platform | head -3
          du -sh "$APP" "$APP/jre"

      - name: Package unsigned IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$DERIVED/Build/Products/$CONFIGURATION-iphoneos/JET.app/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/package_ipa.sh "$DERIVED/Build/Products/$CONFIGURATION-iphoneos/JET.app" "dist/JET-$VERSION-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JET-${{ env.VERSION }}-runtime-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa

  simulator-smoke:
    name: Simulator smoke (import -> first screen -> taps; JVM hello)
    needs: [guard, jre]
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      DERIVED: build/DerivedSim
      BUNDLE_ID: dev.jet.app
    steps:
      - uses: actions/checkout@v4
      - name: Repository guard
        run: scripts/guard_repo.sh
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21.0.1' }
      - uses: actions/download-artifact@v4
        with: { name: jre21-zero-iphonesimulator, path: build/jre-dl }
      - name: Stage JRE + Java code (iphonesimulator)
        run: scripts/stage_jvm.sh iphonesimulator build/jre-dl/jre21-zero-iphonesimulator.tar.xz
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          scripts/sync_icon.sh
          xcodegen generate --spec project.yml
      - name: Pick + boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(rt, x) for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda p: (p[0], "Pro" not in p[1]["name"], p[1]["name"]))
          print(c[-1][1]["udid"] if c else "")')
          [ -n "$UDID" ] || { echo "::error::no iPhone simulator available"; xcrun simctl list devices available; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for the simulator
        run: |
          mkdir -p build
          xcodebuild -project JET.xcodeproj -scheme JET -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO build > build/xcodebuild-sim.log 2>&1 || { grep -E 'error:' build/xcodebuild-sim.log | head -n 80; tail -n 60 build/xcodebuild-sim.log; exit 1; }
          ls "$DERIVED/Build/Products/Debug-iphonesimulator/JET.app"
      - name: Fetch the open-source test APK (F-Droid, sha256-checked, not committed)
        run: |
          NOTICE=Modules/heading/NOTICE
          URL=$(sed -n 's/^apk-url: *//p' $NOTICE); SHA=$(sed -n 's/^apk-sha256: *//p' $NOTICE)
          curl -fsSL --retry 3 -o build/test.apk "$URL"
          echo "$SHA  build/test.apk" | shasum -a 256 -c -
      - name: Install, import, run, tap
        run: |
          xcrun simctl install "$UDID" "$DERIVED/Build/Products/Debug-iphonesimulator/JET.app"
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$DATA/Documents"; cp build/test.apk "$DATA/Documents/heading.apk"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -JETSmokeAPK Documents/heading.apk -JETSmokeTaps "1,2,0,TAS,9,5,~TC,7"
          OUT="$DATA/Documents/jet-smoke"
          for i in $(seq 1 120); do [ -f "$OUT/result.txt" ] && break; sleep 1; done
          mkdir -p build/smoke
          xcrun simctl io "$UDID" screenshot build/smoke/simulator_screen.png || true
          cp -R "$OUT/." build/smoke/ 2>/dev/null || true
          echo "---- log"; cat build/smoke/log.txt || true
          RESULT=$(cat build/smoke/result.txt 2>/dev/null || echo "FAIL no result (timeout)")
          echo "smoke: $RESULT"
          case "$RESULT" in PASS*) ;; *) echo "::error::simulator smoke failed: $RESULT"; exit 1 ;; esac
      - name: JVM hello (no-JIT OpenJDK Zero inside JET)
        if: always()
        run: |
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          OUT="$DATA/Documents/jet-smoke"; rm -rf "$OUT"
          T0=$(python3 -c 'import time;print(time.time())')
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -JETSmokeJVM hello
          for i in $(seq 1 300); do [ -f "$OUT/result.txt" ] && break; sleep 1; done
          T1=$(python3 -c 'import time;print(time.time())')
          mkdir -p build/smoke-jvm
          xcrun simctl io "$UDID" screenshot build/smoke-jvm/simulator_screen.png || true
          cp -R "$OUT/." build/smoke-jvm/ 2>/dev/null || true
          python3 -c "print('launch->result wall %.1f s' % ($T1-$T0))" | tee -a build/smoke-jvm/timing.txt
          echo "---- log"; cat build/smoke-jvm/log.txt || true
          echo "---- jvm.log"; tail -n 80 build/smoke-jvm/jvm.log || true
          RESULT=$(cat build/smoke-jvm/result.txt 2>/dev/null || echo "FAIL no result (timeout)")
          echo "jvm smoke: $RESULT"
          case "$RESULT" in PASS*) ;; *) echo "::error::JVM smoke failed: $RESULT"; exit 1 ;; esac
      - name: Simulator log excerpt
        if: failure()
        run: xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "JET"' | tail -n 200 || true
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: |
            build/smoke
            build/smoke-jvm
            build/xcodebuild-sim.log
          if-no-files-found: ignore
