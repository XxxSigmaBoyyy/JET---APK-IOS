name: Validate (Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Repository guard
        run: scripts/guard_repo.sh
      - name: YAML + scripts
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ios-ipa.yml')); yaml.safe_load(open('project.yml')); print('yaml ok')"
          bash -n scripts/*.sh
          test -f Assets/AppIcon-1024.png
          test -f JET/Resources/Assets.xcassets/BrandIcon.imageset/BrandIcon.png
          echo validate ok
